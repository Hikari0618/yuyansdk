name: Sync Upstream & Update Rime Schemas

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check upstream YuyanIme
        id: check_yuyan
        run: |
          git remote add upstream https://github.com/gurecn/YuyanIme.git 2>/dev/null || true
          git fetch upstream 2>/dev/null || true
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/master 2>/dev/null || git rev-parse upstream/main 2>/dev/null || echo "none")
          if [ "$LOCAL" != "$UPSTREAM" ] && [ "$UPSTREAM" != "none" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Check rime-wanxiang releases
        id: check_wanxiang
        run: |
          # 获取最新 release 版本号
          LATEST=$(curl -s https://api.github.com/repos/amzxyz/rime-wanxiang/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          LOCAL_VERSION=$(cat yuyansdk/src/main/assets/rime/wanxiang_version.txt 2>/dev/null || echo "none")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "local=$LOCAL_VERSION" >> $GITHUB_OUTPUT
          if [ "$LATEST" != "$LOCAL_VERSION" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Download and update rime-wanxiang
        if: steps.check_wanxiang.outputs.has_update == 'true'
        run: |
          VERSION="${{ steps.check_wanxiang.outputs.latest }}"
          RIME_DIR="yuyansdk/src/main/assets/rime"

          echo "📦 Downloading rime-wanxiang $VERSION flypy-fuzhu release..."
          wget -q "https://github.com/amzxyz/rime-wanxiang/releases/download/$VERSION/rime-wanxiang-flypy-fuzhu.zip" -O /tmp/wx-flypy.zip

          echo "📦 Downloading language model (gram)..."
          wget -q "https://github.com/amzxyz/RIME-LMDG/releases/download/LTS/wanxiang-lts-zh-hans.gram" -O /tmp/wanxiang-lts-zh-hans.gram

          echo "📦 Extracting..."
          mkdir -p /tmp/wx-extract
          python3 -c "
          import zipfile
          with zipfile.ZipFile('/tmp/wx-flypy.zip','r') as z:
              z.extractall('/tmp/wx-extract')
          "

          # 清理旧文件
          rm -rf "$RIME_DIR/dicts" "$RIME_DIR/lua" "$RIME_DIR/custom"

          # 复制 release 包内容
          cp -r /tmp/wx-extract/dicts "$RIME_DIR/dicts"
          cp -r /tmp/wx-extract/lua "$RIME_DIR/lua"
          mkdir -p "$RIME_DIR/custom"
          cp /tmp/wx-extract/custom/* "$RIME_DIR/custom/" 2>/dev/null || true

          for f in wanxiang_pro.dict.yaml wanxiang_pro.schema.yaml wanxiang_algebra.yaml \
                   wanxiang_symbols.yaml wanxiang_reverse.dict.yaml wanxiang_reverse.schema.yaml \
                   wanxiang_english.dict.yaml wanxiang_english.schema.yaml \
                   wanxiang_mixedcode.dict.yaml wanxiang_mixedcode.schema.yaml \
                   default.yaml custom_phrase.txt weasel.yaml version.txt; do
            [ -f "/tmp/wx-extract/$f" ] && cp "/tmp/wx-extract/$f" "$RIME_DIR/$f"
          done

          # 复制语法模型
          cp /tmp/wanxiang-lts-zh-hans.gram "$RIME_DIR/wanxiang-lts-zh-hans.gram"

          # 追加同步配置到 default.yaml
          echo '' >> "$RIME_DIR/default.yaml"
          echo '# 用户同步配置' >> "$RIME_DIR/default.yaml"
          echo 'sync_dir: "/sdcard/rime/sync"' >> "$RIME_DIR/default.yaml"
          echo 'sync_frequency: 30' >> "$RIME_DIR/default.yaml"

          # 写入自定义配置: 小鹤双拼 + 间接辅助 + 模糊音 en/eng in/ing + 大字集
          cat > "$RIME_DIR/wanxiang_pro.custom.yaml" << 'CUSTOM_EOF'
          # 万象拼音PRO - 小鹤双拼 + 间接辅助码 + 模糊音
          patch:
            speller/algebra:
              __patch:
                - wanxiang_algebra:/模糊音_en_eng
                - wanxiang_algebra:/模糊音_in_ing
                - wanxiang_algebra:/pro/小鹤双拼
                - wanxiang_algebra:/pro/间接辅助
            switches/@0/reset: 0
            menu/page_size: 6
          CUSTOM_EOF

          # 记录版本
          echo "$VERSION" > "$RIME_DIR/wanxiang_version.txt"

          # 清理临时文件
          rm -rf /tmp/wx-flypy.zip /tmp/wx-extract /tmp/wanxiang-lts-zh-hans.gram

          echo "✅ Updated to $VERSION"

      - name: Merge upstream YuyanIme
        if: steps.check_yuyan.outputs.has_update == 'true'
        run: |
          git merge upstream/master --no-edit 2>/dev/null || git merge upstream/main --no-edit 2>/dev/null || true

      - name: Commit and push
        if: steps.check_wanxiang.outputs.has_update == 'true' || steps.check_yuyan.outputs.has_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MSG="🔄 自动同步上游更新"
          [ "${{ steps.check_wanxiang.outputs.has_update }}" == "true" ] && MSG="$MSG | 万象拼音 ${{ steps.check_wanxiang.outputs.latest }}"
          [ "${{ steps.check_yuyan.outputs.has_update }}" == "true" ] && MSG="$MSG | 语燕引擎"
          git add -A
          git diff --cached --quiet || git commit -m "$MSG"
          git push

      - name: No updates
        if: steps.check_wanxiang.outputs.has_update != 'true' && steps.check_yuyan.outputs.has_update != 'true'
        run: echo "⏭️ No upstream updates."
