                  - text: ", based on"
                  - link "RIME" [ref=e737] [cursor=pointer]:
                    - /url: http://rime.im
                  - text: input method framework and written in Java/Kotlin with JNI. It is designed to protect the native language of various local dialects of Chinese and is a universal shape-based and phonetic-based input method platform.
