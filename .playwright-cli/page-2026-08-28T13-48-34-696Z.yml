                - paragraph [ref=e766]:
                  - text: TRIME is the abbreviation of
                  - emphasis [ref=e767]: Tongwen RIME
                  - text: or
                  - emphasis [ref=e768]: ThaeRv Input Method
                  - text: .
                - paragraph [ref=e769]:
                  - text: From the beginning, TRIME was written for TaeRv Pinyin, and named
                  - emphasis [ref=e770]: TaeRv Input Method (泰如输入法)
                  - text: .
                - paragraph [ref=e771]:
                  - text: Then, we created an input method platform with some code tables, such as Wu dialect (吴语). We renamed it to
                  - emphasis [ref=e772]: Chinese Character Dialect Input Method (汉字方言输入法)
                  - text: .
                - paragraph [ref=e773]:
                  - text: Later, it supports Wubi and Liangbi and other shape-based input method, we branded it
                  - link [ref=e774] [cursor=pointer]:
                    - /url: https://github.com/osfans/trime-legacy
                    - emphasis [ref=e775]: Tongwen Input Method Platform 2.0 (同文输入法平台 2.0)
                  - text: ", which implies that the phonetic-based and shape-based input method on one platform, while dialects and Mandrain share one kind of characters."
                - paragraph [ref=e776]:
                  - text: Benefit from the
                  - link "librime" [ref=e777] [cursor=pointer]:
                    - /url: https://github.com/rime/librime
                  - text: project by JNI, we are now in version 3.0 of TRIME aka
                  - emphasis [ref=e778]: Tongwen Input Method (同文输入法)
                  - text: .
