
cn_en:
  db_class: stabledb
  dictionary: ""
  enable_completion: true
  enable_sentence: false
  initial_quality: 0.5
  user_dict: "en_dicts/cn_en_abc"
emoji:
  inherit_comment: false
  opencc_config: emoji.json
  option_name: emoji
engine:
  filters:
    - "simplifier@emoji"
    - "simplifier@traditionalize"
    - uniquifier
  processors:
    - ascii_composer
    - recognizer
    - speller
    - punctuator
    - selector
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - echo_translator
    - script_translator
    - "table_translator@english"
    - "table_translator@cn_en"
english:
  dictionary: english
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 1.1
punctuator:
  symbols:
    "/": ["@", "＃", "＊", "＋", "……", "〜", "（", "）", "、", "/"]
recognizer:
  patterns:
    punct: "^/([0-9]|10|[A-Za-z]*?)$"
schema:
  dependencies:
    - english
  name: "紫光双拼"
  schema_id: double_pinyin_ziguang
speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA;`/"
  delimiter: "''"
  algebra:
    # 键位映射来源：万象 wanxiang_algebra.yaml 紫光双拼（去声调、转写为通用双拼键位）
    - erase/^xx$/
    - xform/^ng$/eng/
    - xform/^n$/en/
    - xform/^m$/me/
    - derive/^([jqxy])u$/$1v/
    - xform/^([aoe].*)$/O$1/
    - xform/en$/W/
    - xform/eng$/T/
    - xform/in$|uai$/Y/
    - xform/^zh/U/
    - xform/^sh/I/
    - xform/uo$/O/
    - xform/ai$/P/
    - xform/^ch/A/
    - xform/[iu]ang$/G/
    - xform/ang$/S/
    - xform/ie$/D/
    - xform/ian$/F/
    - xform/(.)i?ong$/$1H/
    - xform/er$|iu$/J/
    - xform/ei$/K/
    - xform/uan$/L/
    - xform/ing$/;/
    - xform/ou$/Z/
    - xform/[iu]a$/X/
    - xform/iao$/B/
    - xform/ue$|ui$|ve$/N/
    - xform/un$/M/
    - xform/ao$/Q/
    - xform/an$/R/
    - xlit/WTYUIOPAGSDFHJKLZXBNMQR/wtyuiopagsdfhjklzxbnmqr/
traditionalize:
  opencc_config: s2t.json
  option_name: traditionalization
translator:
  always_show_comments: true
  dictionary: pinyin
  initial_quality: 1.2
  prism: double_pinyin_ziguang
  spelling_hints: 100
