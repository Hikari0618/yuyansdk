
cn_en:
  db_class: stabledb
  dictionary: ""
  enable_completion: true
  enable_sentence: false
  initial_quality: 0.5
  user_dict: "en_dicts/cn_en_abc"
emoji:
  inherit_comment: false
  opencc_config: emoji.json
  option_name: emoji
engine:
  filters:
    - "simplifier@emoji"
    - "simplifier@traditionalize"
    - uniquifier
  processors:
    - ascii_composer
    - recognizer
    - speller
    - punctuator
    - selector
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - echo_translator
    - script_translator
    - "table_translator@english"
    - "table_translator@cn_en"
english:
  dictionary: english
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 1.1
punctuator:
  symbols:
    "/": ["＠", "＃", "＊", "＋", "……", "〜", "（", "）", "、", "/"]
recognizer:
  patterns:
    punct: "^/([0-9]|10|[A-Za-z]*?)$"
schema:
  dependencies:
    - english
  name: "智能ABC双拼"
  schema_id: double_pinyin_abc
speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`/"
  delimiter: "''"
  algebra:
    # 键位映射来源：rime/rime-double-pinyin 官方方案 double_pinyin_abc.schema.yaml（智能ABC双拼）
    - erase/^xx$/
    - derive/^([jqxy])u$/$1v/
    - xform/^zh/A/
    - xform/^ch/E/
    - xform/^sh/V/
    - xform/^([aoe].*)$/O$1/
    - xform/ei$/Q/
    - xform/ian$/W/
    - xform/er$|iu$/R/
    - xform/[iu]ang$/T/
    - xform/ing$/Y/
    - xform/uo$/O/
    - xform/uan$/P/
    - xform/i?ong$/S/
    - xform/[iu]a$/D/
    - xform/en$/F/
    - xform/eng$/G/
    - xform/ang$/H/
    - xform/an$/J/
    - xform/iao$/Z/
    - xform/ao$/K/
    - xform/in$|uai$/C/
    - xform/ai$/L/
    - xform/ie$/X/
    - xform/ou$/B/
    - xform/un$/N/
    - xform/[uv]e$|ui$/M/
    - xlit/QWERTYOPASDFGHJKLZXCVBNM/qwertyopasdfghjklzxcvbnm/
traditionalize:
  opencc_config: s2t.json
  option_name: traditionalization
translator:
  always_show_comments: true
  dictionary: pinyin
  initial_quality: 1.2
  prism: double_pinyin_abc
  spelling_hints: 100
