# 万象拼音PRO - 小鹤双拼 + 模糊音方案
# 自定义配置：使用小鹤双拼 + 直接辅助码 + 常用模糊音
patch:
  speller/algebra:
    __patch:
      # === 模糊音（全部开启） ===
      - wanxiang_algebra:/模糊音_nl        # n/l 不分
      - wanxiang_algebra:/模糊音_ry        # r/y 不分
      - wanxiang_algebra:/模糊音_hf        # h/f 不分
      - wanxiang_algebra:/模糊音_rl        # r/l 不分
      - wanxiang_algebra:/模糊音_kg        # k/g 不分
      - wanxiang_algebra:/模糊音_en_eng    # en/eng 不分
      - wanxiang_algebra:/模糊音_in_ing    # in/ing 不分
      - wanxiang_algebra:/模糊音_c_ch      # c/ch 不分
      - wanxiang_algebra:/模糊音_z_zh      # z/zh 不分
      - wanxiang_algebra:/模糊音_s_sh      # s/sh 不分
      # === 双拼方案：小鹤 ===
      - wanxiang_algebra:/pro/小鹤双拼
      # === 辅助码：直接辅助 ===
      - wanxiang_algebra:/pro/直接辅助
      # 小鹤双拼提权（可选，取消注释启用）
      #- wanxiang_algebra:/小鹤双拼提权

  # 候选数量
  menu/page_size: 6
