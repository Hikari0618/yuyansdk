# Rime default settings
# encoding: utf-8

config_version: '0.40'

schema_list:
  # 必须与 assets/rime/ 下真实存在的 *.schema.yaml 的 schema_id 一致，
  # 否则该方案在部署时不会被编译 → select_schema 失败 → 表现为「方案失效/打不出字」。
  # 原清单写的是 luna_pinyin/bopomofo/cangjie5/terra_pinyin 等本仓库并不存在的方案，
  # 导致内置拼音(pinyin)、九键(t9_pinyin)、英文(english)、七种双拼全部无法加载。
  - schema: pinyin                 # 拼音·全键（CustomConstant.SCHEMA_ZH_QWERTY）
  - schema: t9_pinyin              # 拼音·九键（SCHEMA_ZH_T9）
  - schema: double_pinyin_flypy    # 小鹤双拼
  - schema: double_pinyin_ls17     # 乱序17双拼（SCHEMA_ZH_DOUBLE_LX17）
  - schema: double_pinyin_abc
  - schema: double_pinyin_mspy
  - schema: double_pinyin_natural
  - schema: double_pinyin_sogou
  - schema: double_pinyin_ziguang
  - schema: english                # 英语方案（SCHEMA_EN）
  - schema: stroke                 # 五笔画（SCHEMA_ZH_STROKE）
  - schema: wanxiang               # 万象拼音PRO（由 /sdcard/yuyan 导入；未部署时 Rime 会跳过）

switcher:
  caption: 〔方案選單〕
  hotkeys:
    - Control+grave
    - Control+Shift+grave
    - F4
  save_options:
    - full_shape
    - ascii_punct
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

menu:
  page_size: 5

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/move_by_word_with_tab
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
